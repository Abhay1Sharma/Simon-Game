<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="simon.css">
  <title>Simon Game</title>
</head>

<body>
  <div class="heading">
    <h1>Simon Game</h1>
    <h2></h2>
    <h3>Press any key to start</h3>
  </div>
  <div class="div">
    <div class="div1 square" type="button" id="red">Red</div>
    <div class="div2 square" type="button" id="blue">Blue</div>
  </div>
  <div class="div">
    <div class="div3 square" type="button" id="orange">Orange</div>
    <div class="div4 square" type="button" id="skyblue">Sky - Blue</div>
  </div>
  <script src="simon.js"></script>
</body>

</html>
